server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip for the JS bundle and friends — cheap win, no downside.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache hashed build assets aggressively; never cache index.html itself
    # (it references the current hashed bundle, so it must always be
    # re-fetched or a client can get stuck on a stale build).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any non-file route (React Router paths) serves
    # index.html and lets the client-side router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
